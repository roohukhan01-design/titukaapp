plugins {
    id 'com.android.application'
}
android {
    namespace 'com.roohu.clipforge'
    compileSdk 34
    defaultConfig {
        applicationId 'com.roohu.clipforge'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '4.2.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes {
        debug { }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES'] }
    }
}

// Kotlin 1.8+ bundles the JDK7/JDK8 extension classes in kotlin-stdlib.
// Older transitive split artifacts otherwise duplicate those same classes.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
