name: Build Roohu ClipForge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild Android project structure from uploaded flat files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/roohu/clipforge
          mkdir -p app/src/main/assets/fonts
          mkdir -p app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          mkdir -p shared/core shared/test

          cp ./*.java app/src/main/java/com/roohu/clipforge/
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp activity_main.xml app/src/main/res/layout/activity_main.xml
          cp colors.xml app/src/main/res/values/colors.xml
          cp strings.xml app/src/main/res/values/strings.xml
          cp themes.xml app/src/main/res/values/themes.xml
          cp splash_bg.xml app/src/main/res/drawable/splash_bg.xml
          cp splash_glow.xml app/src/main/res/drawable/splash_glow.xml
          cp splash_logo.xml app/src/main/res/drawable/splash_logo.xml
          cp ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher_foreground.xml
          cp ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp Roohu-ClipForge.html app/src/main/assets/
          cp validate.js motion.js app/src/main/assets/
          cp validate.js shared/core/validate.js
          cp motion.js shared/core/motion.js
          cp validate.test.js projects.test.js subtitles.test.js motion.test.js shared/test/

          test -s app/src/main/java/com/roohu/clipforge/MainActivity.java
          test -s app/src/main/assets/Roohu-ClipForge.html
          test -s shared/core/validate.js
          test -s shared/core/motion.js
          echo "Android module structure created and required files verified."

      - name: Download offline speech models
        shell: bash
        run: |
          set -euo pipefail
          cd app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q en.zip
          mv vosk-model-small-en-us-0.15 model-en
          rm en.zip
          curl -fL --retry 3 --retry-delay 2 -o hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q hi.zip
          mv vosk-model-small-hi-0.22 model-hi
          rm hi.zip
          test -d model-en && test -d model-hi

      - name: Run JavaScript validation tests
        shell: bash
        run: |
          set -euo pipefail
          node shared/test/validate.test.js
          node shared/test/projects.test.js
          node shared/test/subtitles.test.js
          node shared/test/motion.test.js

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          echo "APK_BUILD_PATH=$APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Roohu-ClipForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
